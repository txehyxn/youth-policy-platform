<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: commonHead('자격 판정 결과')}"></th:block>
</head>
<body>

<header th:replace="~{fragments/layout :: header}"></header>

<main class="site-main">
<div class="container">

<h1>신청 가능 여부 결과</h1>

<section class="card">
    <p class="muted" th:if="${!#strings.isEmpty(result.categoryName)}"
       th:text="${result.categoryName}"></p>
    <h2 th:text="${result.benefitTitle}"></h2>
    <p>
        <strong>지원 내용</strong><br>
        <span th:text="${result.supportAmount}"></span>
    </p>
</section>

<hr>

<h2 th:if="${result.eligible}">
    <span class="badge badge--eligible">ELIGIBLE</span><br>
    최종 결과: 신청 가능합니다.
</h2>

<h2 th:if="${result.ineligible}">
    <span class="badge badge--ineligible">INELIGIBLE</span><br>
    최종 결과: 신청 불가능합니다.
</h2>

<h2 th:if="${result.needMoreInfo}">
    <span class="badge badge--need-info">NEED_MORE_INFO</span><br>
    최종 결과: 추가 정보가 필요합니다.
</h2>

<div th:if="${!result.eligible}">
    <h3>판정 사유</h3>

    <ul>
        <li th:each="condition : ${result.conditionResults}"
            th:if="${!condition.passed}"
            th:text="${condition.message}">
        </li>
    </ul>
</div>

<hr>

<h3>조건별 판별 결과</h3>

<div class="table-wrap">
<table>
    <tr>
        <th>조건 항목</th>
        <th>정책 기준</th>
        <th>내 정보</th>
        <th>결과</th>
        <th>안내 메시지</th>
    </tr>

    <tr th:each="condition : ${result.conditionResults}">
        <td th:text="${condition.fieldLabel}"></td>

        <td>
            <span th:text="${condition.valueLabel}"></span>
            <span th:if="${condition.operatorLabel != ''}"
                  th:text="${condition.operatorLabel}">
            </span>
        </td>

        <td th:text="${condition.userValueLabel}"></td>

        <td>
            <span th:if="${condition.passed}" style="color: green;">
                통과
            </span>

            <span th:if="${!condition.passed and !condition.needMoreInfo}" style="color: red;">
                실패
            </span>

            <span th:if="${condition.needMoreInfo}" style="color: orange;">
                확인 필요
            </span>
        </td>

        <td th:text="${condition.message}"></td>
    </tr>
</table>
</div>

<hr>

<div class="actions">
    <a class="button button--secondary"
       th:href="@{/benefits/{id}(id=${result.benefitId})}">정책 상세로 돌아가기</a>

    <a class="button"
       th:if="${!#strings.isEmpty(result.applicationUrl)}"
       th:href="${result.applicationUrl}"
       target="_blank"
       rel="noopener noreferrer">공식 신청 사이트 확인</a>

    <form th:if="${isBookmarked}"
          th:action="@{/bookmarks/{id}/delete(id=${result.benefitId})}"
          method="post">
        <button class="button button--secondary" type="submit">♥ 관심 취소</button>
    </form>

    <form th:unless="${isBookmarked}"
          th:action="@{/bookmarks/{id}(id=${result.benefitId})}"
          method="post">
        <button class="button button--secondary" type="submit">♡ 관심 정책 저장</button>
    </form>
</div>

<p>
    <a th:href="@{/my/profile}">내 프로필 수정하기</a>
</p>

</div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
