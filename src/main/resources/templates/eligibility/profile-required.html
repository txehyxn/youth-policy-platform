<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: commonHead('프로필 정보 필요')}"></th:block>
</head>
<body>

<header th:replace="~{fragments/layout :: header}"></header>

<main class="site-main">
    <div class="container">
        <section class="card">
            <span class="badge badge--need-info">프로필 등록 필요</span>
            <h1>맞춤 정책 판정을 위해 프로필 정보가 필요합니다</h1>
            <p th:text="${errorMessage}">
                신청 가능 여부를 확인하려면 먼저 내 프로필을 등록해야 합니다.
            </p>
            <p class="muted">
                로그인은 완료되었습니다. 나이, 거주지역, 소득 등 판정에 필요한 정보만 등록하면
                이 정책의 신청 가능 여부를 확인할 수 있습니다.
            </p>

            <div class="actions">
                <a class="button"
                   th:href="@{/my/profile(returnBenefitId=${benefitId})}">프로필 등록하기</a>
                <a class="button button--secondary"
                   th:href="@{/benefits/{id}(id=${benefitId})}">정책 상세로 돌아가기</a>
            </div>
        </section>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
